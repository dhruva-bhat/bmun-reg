<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root { --green:#1e7b34; --red:#b3261e; --line:#d0d4da; --muted:#5f6670; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 16px; max-width: 960px; margin-inline: auto; color:#1c1f23; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  input, select, button { font: inherit; padding: 8px 10px; border:1px solid var(--line); border-radius:6px; }
  button { background:#f3f4f6; cursor:pointer; } button.primary { background:#1a56db; color:#fff; border-color:#1a56db; }
  button:disabled { opacity:.5; cursor:default; }
  #results button { display:block; width:100%; text-align:left; margin-top:4px; }
  .strip { display:flex; gap:12px; flex-wrap:wrap; margin:12px 0; padding:12px; border-radius:8px; color:#fff; }
  .strip.green { background:var(--green); } .strip.red { background:var(--red); }
  .strip div b { display:block; font-size:22px; }
  table { border-collapse:collapse; width:100%; margin-top:8px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  .yes { color:var(--green); } .no { color:var(--red); font-weight:600; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  #msg { margin:8px 0; min-height:1.2em; } #msg.err { color:var(--red); }
  fieldset { border:1px solid var(--line); border-radius:8px; margin-top:12px; }
  .muted { color:var(--muted); font-size:13px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<h1>BMUN Check-in <span class="muted">· <?= user ?></span></h1>
<div class="row">
  <input id="q" placeholder="Search school or alias" autofocus style="flex:1;min-width:220px">
  <button id="allMissing">Download missing waivers (all schools)</button>
</div>
<div id="results"></div>
<div id="msg" role="status"></div>

<section id="school" hidden>
  <h2 id="schoolName"></h2>
  <div id="strip" class="strip"></div>
  <div class="row">
    <button id="dl">Download missing waivers</button>
    <button id="change">Record a change</button>
    <button id="checkin" class="primary">Check in school</button>
  </div>
  <table><thead><tr><th>Name</th><th>Workshop</th><th>Waiver</th><th>Room</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table>

  <fieldset id="form" hidden>
    <legend>Record a change</legend>
    <div class="row">
      <select id="action">
        <option value="drop">Drop</option>
        <option value="late_add">Late add</option>
        <option value="fix_name">Fix a name</option>
        <option value="change_workshop">Change workshop</option>
        <option value="paper_waiver">Waiver received on paper</option>
      </select>
      <select id="who"></select>
      <input id="newName" placeholder="Name">
      <select id="workshop"><option>Novice</option><option>Advanced</option><option>Crisis</option><option>Chair</option></select>
      <button id="submit" class="primary">Submit</button>
    </div>
  </fieldset>
</section>

<script>
  var current = null, timer = null;
  var $ = function (id) { return document.getElementById(id); };

  function say(text, err) { var m = $('msg'); m.textContent = text || ''; m.className = err ? 'err' : ''; }
  function run(fn) {
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, Array.prototype.slice.call(arguments, 1));
    });
  }
  function fail(e) { say(e && e.message ? e.message : String(e), true); }

  $('q').addEventListener('input', function () {
    clearTimeout(timer);
    var q = this.value;
    timer = setTimeout(function () {
      if (!q.trim()) { $('results').innerHTML = ''; return; }
      run('api_searchSchools', q).then(function (list) {
        var box = $('results'); box.innerHTML = '';
        list.forEach(function (s) {
          var b = document.createElement('button'); b.textContent = s.name;
          b.onclick = function () { box.innerHTML = ''; load(s.school_id); };
          box.appendChild(b);
        });
        if (!list.length) box.textContent = 'No school matches. Ask an admin to add the alias.';
      }).catch(fail);
    }, 250);
  });

  function load(id) { say(''); return run('api_getSchool', id).then(render).catch(fail); }

  function render(v) {
    current = v;
    $('school').hidden = false;
    $('schoolName').textContent = v.name + (v.checkedIn ? ' (checked in)' : '');
    var s = v.summary, strip = $('strip');
    strip.className = 'strip ' + s.status;
    strip.innerHTML = '';
    [['Advisor waiver', s.advisorWaiver ? 'Yes' : 'No'], ['Delegates', s.registered], ['Waivers', s.waivers], ['Missing', s.missing]].forEach(function (p) {
      var d = document.createElement('div'); d.textContent = p[0];
      var b = document.createElement('b'); b.textContent = p[1]; d.insertBefore(b, d.firstChild); strip.appendChild(d);
    });
    var tb = $('rows'); tb.innerHTML = '';
    v.delegates.forEach(function (d) {
      var tr = document.createElement('tr');
      [d.name, d.workshop, d.waiver ? 'Yes' : 'No', d.room, d.status].forEach(function (t, i) {
        var td = document.createElement('td'); td.textContent = t;
        if (i === 2) td.className = d.waiver ? 'yes' : 'no';
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    var who = $('who'); who.innerHTML = '';
    v.delegates.filter(function (d) { return d.status !== 'dropped'; }).forEach(function (d) {
      var o = document.createElement('option'); o.value = 'D:' + d.delegate_id; o.textContent = d.name; who.appendChild(o);
    });
    v.advisors.forEach(function (a) {
      var o = document.createElement('option'); o.value = 'A:' + a.advisor_id; o.textContent = a.name + ' (advisor)'; who.appendChild(o);
    });
    syncForm();
  }

  function syncForm() {
    var a = $('action').value;
    $('who').hidden = a === 'late_add';
    $('newName').hidden = !(a === 'late_add' || a === 'fix_name');
    $('workshop').hidden = !(a === 'late_add' || a === 'change_workshop');
  }
  $('action').addEventListener('change', syncForm);
  $('change').onclick = function () { $('form').hidden = !$('form').hidden; };

  $('submit').onclick = function () {
    var a = $('action').value, p = { school_id: current.school_id };
    var who = $('who').value;
    if (a !== 'late_add' && who) { var k = who.split(':'); p[k[0] === 'A' ? 'advisor_id' : 'delegate_id'] = k[1]; }
    if (a === 'late_add' || a === 'fix_name') p.name = $('newName').value;
    if (a === 'late_add' || a === 'change_workshop') p.workshop = $('workshop').value;
    this.disabled = true; var btn = this;
    run('api_recordChange', a, p).then(function (v) { render(v); $('newName').value = ''; say('Saved.'); })
      .catch(fail).then(function () { btn.disabled = false; });
  };

  $('checkin').onclick = function () {
    var p = { school_id: current.school_id };
    if (current.summary.missing > 0 || !current.summary.advisorWaiver) {
      var note = prompt('Waivers are missing. Add a short note to check in anyway:');
      if (!note) return;
      p.note = note;
    }
    run('api_recordChange', 'check_in_school', p).then(function (v) { render(v); say('Checked in.'); }).catch(fail);
  };

  function download(schoolId, name) {
    run('api_missingCsv', schoolId).then(function (csv) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = name; a.click(); URL.revokeObjectURL(a.href);
    }).catch(fail);
  }
  $('dl').onclick = function () { download(current.school_id, 'missing-waivers-' + current.name + '.csv'); };
  $('allMissing').onclick = function () { download('', 'missing-waivers-all.csv'); };
</script>
</body>
</html>
